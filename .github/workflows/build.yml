# Compiles both board variants on every push and pull request, so a broken
# commit is caught before anyone tags a release.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The ESP32 toolchain is ~2.5 GB; without this cache every run downloads it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - run: pip install platformio

      - run: pio run -e cyd -e cyd2usb
