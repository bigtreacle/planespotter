; Nearest-plane display for the "Cheap Yellow Display" (ESP32-2432S028)
;
; Two board variants exist. Build the one that matches yours:
;   pio run -e cyd -t upload        -> original board, single micro-USB (ILI9341)
;   pio run -e cyd2usb -t upload    -> newer board, USB-C + micro-USB (ST7789)
; If colours look inverted or wrong, you have the other variant.

[platformio]
default_envs = cyd

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.0.0

[common]
build_flags =
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

; FIRMWARE_VERSION defaults to "dev" in src/ota.h. CI overrides it from the
; git tag via the PLATFORMIO_BUILD_FLAGS environment variable, e.g.
;   PLATFORMIO_BUILD_FLAGS='-DFIRMWARE_VERSION=\"1.1.0\"' pio run -e cyd

[env:cyd]
build_flags =
    ${common.build_flags}
    -DILI9341_2_DRIVER=1
    -DBOARD_VARIANT=\"cyd\"

[env:cyd2usb]
build_flags =
    ${common.build_flags}
    -DST7789_DRIVER=1
    -DTFT_INVERSION_OFF=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DBOARD_VARIANT=\"cyd2usb\"
